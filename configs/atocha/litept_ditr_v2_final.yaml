_base_: base.yaml

run_name: LitePT-Ditr-v2-G/c128-run1

dataset:
  type: Atocha
  with_image: True

mix_prob: 0.8

# =============================================================================
# Model settings
# =============================================================================
model:
  type: Point-Segmentor-GeoAux
  num_classes: 10
  backbone_out_channels: 72
  geo_out_channels: 72
  backbone:
    type: LitePT-Ditr-v2-G
    in_channels: 6
    order: ["z", "z-trans", "hilbert", "hilbert-trans"]
    stride: [2, 2, 2, 2]
    enc_depths: [2, 2, 2, 6, 2]
    enc_channels: [36, 72, 144, 252, 504]
    enc_num_head: [2, 4, 8, 14, 28]
    enc_patch_size: [1024, 1024, 1024, 1024, 1024]
    enc_conv: [True, True, True, False, False]
    enc_attn: [False, False, False, True, True]
    enc_rope_freq: [100.0, 100.0, 100.0, 100.0, 100.0]
    dec_depths: [0, 0, 0, 0]
    dec_channels: [72, 72, 144, 252]
    dec_num_head: [4, 4, 8, 14]
    dec_patch_size: [1024, 1024, 1024, 1024]
    dec_conv: [False, False, False, False]
    dec_attn: [False, False, False, False]
    dec_rope_freq: [100.0, 100.0, 100.0, 100.0]
    mlp_ratio: 4
    qkv_bias: True
    qk_scale: null
    attn_drop: 0.0
    proj_drop: 0.0
    drop_path: 0.3
    pre_norm: True
    shuffle_orders: True
    enc_mode: False
    freeze_encoder: False
    dino_type: DinoV3
    dino_size: base
    dino_frozen: True
    use_checkpoint: False

    # Every decoder stage uses gather-based fusion (matches F's default).
    dec_fusion:
      - name: add_skip_up_image     # s=0  finest  (dec_channels[0] = 72)
        use_ffn: False
      - name: add_skip_up_image     # s=1           (dec_channels[1] = 72)
        use_ffn: False
      - name: add_skip_up_image     # s=2           (dec_channels[2] = 144)
        use_ffn: False
      - name: add_skip_up_image     # s=3  coarsest (dec_channels[3] = 252)
        use_ffn: False

    # K = 4 DINO blocks. Same indices as F so the input signal is identical.
    dino_fusion_layers: [-9, -6, -3, -1]

    # Per-DINO-layer projection width. Output width = K * c_proj = 4 * 128 = 512
    # (matches F's image_inner_dim). Bump to 256/512 to widen the concat output.
    c_proj: 128

    img_proj_dropout: 0.0

    # One spatial octave per decoder stage, matching the 3D backbone's
    # stride-2 pooling. Stage s gets image map at (H/2^s, W/2^s) and effective
    # patch_size = base_patch_size * 2^s.
    pyramid_stage_downsamples: [0, 1, 2, 3]

    geo_dec: true


# =============================================================================
# Training settings
# =============================================================================

training:
  split: train
  resume: null
  epochs: 50
  device: "cuda"
  eval_every: 1
  test_every: 5
  batch_size: 12
  seed: 42
  num_workers: 7
  prefetch_factor: 2
  amp: True
  amp_dtype: bfloat16
  grad_clip: 10.0
  debug_nan: True
  grad_accum: 2
  save_period: 1
  early_stopping_patience: 5
  transform:
    - Update:
        keys_dict:
          index_valid_keys: [
              coord,
              color,
              segment,
              grid_coord,
              image_coord,
              image_mask
          ]

    - RandomZRotation:
        angle_range: [-1, 1]

    - RandomScale:
        scale_range: [0.9, 1.1]

    - RandomJitter:
        sigma: 0.01
        clip: 0.05

    - RandomFlip:
        p: 0.5

    - CenterShift:
        apply_z: True
        center_mode: bounding_box

    - GridSample:
        grid_size: 0.05
        hash_type: "fnv"
        mode: "train"
        return_grid_coord: True

    - NormalizeColor: null

    # - ImageResize:
    #     size: [768, 1008]

    - ImageColorJitter:
        brightness: 0.4
        contrast: 0.4
        saturation: 0.2
        hue: 0.1

    - ImageRandomHorizontalFlip: null

    - ImageNormalize: null

    - ToTensor: null

    - Collect:
        keys: ["coord", "grid_coord", "segment", "image", "image_coord", "image_mask"]
        feat_keys: ["coord", "color"]


# =============================================================================
# Validation settings
# =============================================================================

val:
 split: val
 batch_size: 12
 num_workers: 15
 transform:
  - Update:
      keys_dict:
        index_valid_keys: [
              coord,
              color,
              segment,
              grid_coord,
              image_coord,
              image_mask
          ]

  - CenterShift:
        apply_z: True
        center_mode: bounding_box

  - GridSample:
      grid_size: 0.05
      hash_type: "fnv"
      mode: "train"
      return_grid_coord: True

  - NormalizeColor: null

  # - ImageResize:
  #     size: [768, 1008]

  - ImageNormalize: null

  - ToTensor: null

  - Collect:
      keys: ["coord", "grid_coord", "segment", "image", "image_coord", "image_mask"]
      feat_keys: ["coord", "color"]


# =============================================================================
# Test settings
# =============================================================================
test:
  split: test
  checkpoint: ./outputs/atocha/${run_name}/weights/best.pt
  results_dir: ./outputs/atocha/${run_name}/test_results
  batch_size: 1
  num_workers: 4

  transform:
    - Update:
        keys_dict:
          index_valid_keys: [coord, color, segment, image_coord, image_mask]
    - CenterShift:
        apply_z: True
        center_mode: bounding_box
    - NormalizeColor: null
    - ImageNormalize: null
    - GridSample:
        grid_size: 0.02
        hash_type: fnv
        mode: train
        return_grid_coord: False
        return_inverse: True

  test_cfg:
    voxelize:
      grid_size: 0.05
      hash_type: fnv
      mode: test
      return_grid_coord: True

    crop: null

    post_transform:
      - CenterShift:
          apply_z: False
          center_mode: bounding_box
      - ToTensor: null
      - Collect:
          keys: ["coord", "grid_coord", "index", "image_coord", "image_mask"]
          feat_keys: ["coord", "color"]

    aug_transform:
      - RandomScale: {scale_range: [0.95, 0.95]}
      - RandomScale: {scale_range: [1.00, 1.00]}
      - RandomScale: {scale_range: [1.05, 1.05]}
      - {RandomScale: {scale_range: [0.95, 0.95]}, RandomFlip: {p: 1.0}}
      - {RandomScale: {scale_range: [1.0, 1.0]}, RandomFlip: {p: 1.0}}
      - {RandomScale: {scale_range: [1.05, 1.05]}, RandomFlip: {p: 1.0}}


# =============================================================================
# Optimizer and scheduler settings
# =============================================================================

optim:
  optimizer: adamw
  weight_decay: 0.005
  momentum: 0.95

param_dicts:
  - keyword: block
    lr: 2e-4


scheduler:
  start_lr: 1e-7
  peak_lr: 2e-3
  end_lr: 1e-5
  warmup_epoch: 5


# =============================================================================
# Losses settings
# =============================================================================

losses:
  - type: CrossEntropyLoss
    loss_weight: 1.0
    ignore_index: ${data.ignore_index}
  - type: LovaszLoss
    loss_weight: 1.0
    mode: multiclass
    ignore_index: ${data.ignore_index}
  - type: AuxGeoLoss
    loss_weight: 0.5
    ignore_index: ${data.ignore_index}
    ce_weight: 1.0
    lovasz_weight: 1.0
    lovasz_mode: multiclass

