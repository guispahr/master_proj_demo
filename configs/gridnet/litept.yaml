_base_: base.yaml

run_name: LitePT-S/run4

dataset:
  type: GridNet-Pair-Dataset
  with_image: False

mix_prob: 0.8

# =============================================================================
# Model settings
# =============================================================================
model:
  type: Base-Segmentor #Base-Segmentor-V2
  num_classes: 11
  backbone_out_channels: 72
  backbone:
    type: LitePT-v1
    in_channels: 6
    order: ["z", "z-trans", "hilbert", "hilbert-trans"]
    stride: [2, 2, 2, 2]
    enc_depths: [2, 2, 2, 6, 2]
    enc_channels: [36, 72, 144, 252, 504]
    enc_num_head: [2, 4, 8, 14, 28]
    enc_patch_size: [1024, 1024, 1024, 1024, 1024]
    enc_conv: [True, True, True, False, False]
    enc_attn: [False, False, False, True, True]
    enc_rope_freq: [100.0, 100.0, 100.0, 100.0, 100.0]
    dec_depths: [0, 0, 0, 0]
    dec_channels: [72, 72, 144, 252]
    dec_num_head: [4, 4, 8, 14]
    dec_patch_size: [1024, 1024, 1024, 1024]
    dec_conv: [False, False, False, False]
    dec_attn: [False, False, False, False]
    dec_rope_freq: [100.0, 100.0, 100.0, 100.0]
    mlp_ratio: 4
    qkv_bias: True
    qk_scale: null
    attn_drop: 0.0
    proj_drop: 0.0
    drop_path: 0.3
    pre_norm: True
    shuffle_orders: True
    enc_mode: False
    

training:
  split: train
  resume: null  # path to a checkpoint to resume from, e.g. "./outputs/run1/weights/last.pt"
  epochs: 50
  device: "cuda"
  eval_every: 1
  test_every: 5
  batch_size: 16
  num_workers: 8
  prefetch_factor: 2
  amp: True
  amp_dtype: bfloat16
  grad_clip: 5.0
  debug_nan: True
  grad_accum: 1
  save_period: 1
  early_stopping_patience: 8   # 0 = disabled
  transform:
    - Update:
        keys_dict:
          index_valid_keys: [
              coord,
              color,
              segment,
              grid_coord
          ]

    - RandomZRotation:
        angle_range: [-1, 1]

    - RandomScale:
        scale_range: [0.95, 1.05]

    - RandomJitter:
        sigma: 0.01
        clip: 0.05

    - RandomFlip:
        p: 0.5

    - CenterShift:
        apply_z: True
        center_mode: centroid

    - RandomShift:
        shift: [[-0.2, 0.2], [-0.2, 0.2], [0, 0]]

    - RandomDropout:
        dropout_ratio: 0.2
        dropout_application_ratio: 0.5

    - GridSample:
        grid_size: 0.05
        # grid_sizes: [0.4, 0.5, 0.6]
        hash_type: "fnv"
        mode: "train"
        return_grid_coord: True

    # RandomColorJitter:
    #   brightness: 0.1
    #   contrast: 0.1

    - NormalizeColor: null

    # ColorDrop:
    #   p: 0.1

    - ToTensor: null  # no arguments

    - Collect:
        keys: ["coord", "grid_coord", "segment"]
        feat_keys: ["coord", "color"]

val:
 split: val
 batch_size: 16
 num_workers: 8
 transform:
  - Update:
      keys_dict:
        index_valid_keys: [
              coord,
              color,
              segment,
              grid_coord,
          ]

  - CenterShift:
        apply_z: True
        center_mode: centroid
  
  - GridSample:
      grid_size: 0.05
      hash_type: "fnv"
      mode: "train"
      return_grid_coord: True
      return_inverse: True

  # SmartPointSampler:
  #   max_points: 49152
  #   ignore_index: 11
  #   ignore_kept_weight: 0.05

  - NormalizeColor: null

  - ToTensor: null  # no arguments

  - Collect:
      keys: ["coord", "grid_coord", "segment"]
      feat_keys: ["coord", "color"]

test:
  split: test
  checkpoint: ./outputs/gridnet/${run_name}/weights/epoch39.pt
  results_dir: ./outputs/gridnet/${run_name}/test_results
  batch_size: 1
  num_workers: 2
  transform:
    - Update:
        keys_dict:
          index_valid_keys: [coord, color, segment]
    - CenterShift:
        apply_z: True
        center_mode: centroid
    - NormalizeColor: null
    - GridSample:
        grid_size: 0.02
        hash_type: fnv
        mode: train
        return_grid_coord: False
        return_inverse: True

  test_cfg:
    voxelize:
      grid_size: 0.05
      hash_type: fnv
      mode: test
      return_grid_coord: True

    crop: null

    post_transform:
      - CenterShift:
          apply_z: True
          center_mode: centroid
      - ToTensor: null
      - Collect:
          keys: ["coord", "grid_coord", "index"]
          feat_keys: ["coord", "color"]

    # Each entry = per-pipeline transform dict. `{}` means identity.
    # RandomFlip(p=1) always flips; axis picked randomly per call.
    aug_transform:
      - RandomScale: {scale_range: [0.95, 0.95]}
      - RandomScale: {scale_range: [1.00, 1.00]}
      - RandomScale: {scale_range: [1.05, 1.05]}
      - RandomFlip: {p: 1.0}
      - {RandomScale: {scale_range: [0.95, 0.95]}, RandomFlip: {p: 1.0}}
      - {RandomScale: {scale_range: [1.05, 1.05]}, RandomFlip: {p: 1.0}}

optim:
  optimizer: adamw
  weight_decay: 0.005
  momentum: 0.95

param_dicts:
  - keyword: block
    lr: 2e-4 # scales every scheduler parameters based on ratio lr/peak_lr

scheduler:
  start_lr: 1e-7
  peak_lr: 2e-3  # base learning rate
  end_lr: 1e-5
  warmup_epoch: 5

losses:
  - type: CrossEntropyLoss
    loss_weight: 1.0
    # weight: [0.95, 1.13, 1.63, 1.88, 0.20, 0.47, 0.05, 0.31, 0.91, 2.17, 1.13] # Fair comparison
    # label_smoothing: 0.01
    ignore_index: ${data.ignore_index}
  - type: LovaszLoss
    loss_weight: 1.0
    mode: multiclass
    ignore_index: ${data.ignore_index}
  # - type: VoxelGeometricLoss
  #   loss_weight: 0.1
  #   boundary_weight: 0.0
  #   edge_weight: 0.0 
  #   smoothness_weight: 1.0
  #   infonce_weight: 0.5     # 0 = off; needs 'feat' in point dict
  #   infonce_temperature: 0.1
  #   edge_alpha: 1.0
  #   smoothness_softmax: True
  #   ignore_index: ${data.ignore_index}
  # - type: GeometricConsistencyLoss
  #   loss_weight: 0.1
  #   k: 8
  #   sigma: 1.0
  #   boundary_weight: 1.0
  #   edge_weight: 0.0        # disabled if you're already using CrossEntropyLoss
  #   smoothness_weight: 1.0
  #   infonce_weight: 0.5     # 0 = off; needs 'feat' in point dict
  #   infonce_temperature: 0.1
  #   knn_chunk_size: 4096
  #   ignore_index: ${data.ignore_index}



