_base_: base.yaml

run_name: PTV3/run3

dataset:
  type: S3DIS
  with_images: False
  image_root: "/rcp/gspahr/s3dis_images"

mix_prob: 0.8
# =============================================================================
# Model settings
# =============================================================================
model:
  type: Base-Segmentor
  num_classes: 13
  backbone_out_channels: 64
  backbone:
    type: PT-v3-Base
    in_channels: 6
    order: ["z", "z-trans", "hilbert", "hilbert-trans"]
    stride: [2, 2, 2, 2]
    enc_depths: [2, 2, 2, 6, 2]
    enc_channels: [32, 64, 128, 256, 512]
    enc_num_head: [2, 4, 8, 16, 32]
    enc_patch_size: [1024, 1024, 1024, 1024, 1024]
    dec_depths: [2, 2, 2, 2]
    dec_channels: [64, 64, 128, 256]
    dec_num_head: [4, 4, 8, 16]
    dec_patch_size: [1024, 1024, 1024, 1024]
    mlp_ratio: 4
    qkv_bias: True
    qk_scale: null
    attn_drop: 0.0
    proj_drop: 0.0
    drop_path: 0.3
    pre_norm: True
    shuffle_orders: True
    enable_rpe: False
    enable_flash: True
    upcast_attention: False
    upcast_softmax: False
    pdnorm_bn: False
    pdnorm_ln: False
    pdnorm_decouple: False # For multi dataset
    pdnorm_adaptive: False # Compute shift and scale with SiLU + Linear layer
    pdnorm_affine: True
    pdnorm_conditions: null #["ScanNet", "S3DIS", "Structured3D"] # For multi dataset

training:
  split: ["Area_1", "Area_2", "Area_3", "Area_4", "Area_6"]
  resume: null
  epochs: 3000
  device: "cuda"
  eval_every: 10
  batch_size: 12
  seed: 42
  num_workers: 21
  prefetch_factor: 2
  amp: True
  amp_dtype: bfloat16
  grad_clip: 10.0
  debug_nan: True
  grad_accum: 1
  save_period: 50
  early_stopping_patience: 0
  transform:
    - Update:
        keys_dict:
          index_valid_keys: [
              coord,
              color,
              normal,
              segment,
              grid_coord,
          ]
    - CenterShift:
        apply_z: true
        center_mode: bounding_box

    - RandomDropout:
        dropout_ratio: 0.2
        dropout_application_ratio: 0.2

    # - RandomZRotation:
    #     angle_range: [-1, 1]
    - RandomRotate:
        angle: [-1, 1]
        axis: z
        center: [0, 0, 0]
        p: 0.5
    - RandomRotate:
        angle: [-1 / 64, 1 / 64]
        axis: x
        p: 0.5
    - RandomRotate:
        angle: [-1 / 64, 1 / 64]
        axis: y
        p: 0.5

    - RandomScale:
        scale_range: [0.9, 1.1]

    - RandomJitter:
        sigma: 0.005
        clip: 0.02

    - RandomFlip:
        p: 0.5

    - ChromaticAutoContrast:
        p: 0.2
        blend_factor: null
    
    - ChromaticTranslation:
        p: 0.95
        ratio: 0.05
    
    - ChromaticJitter:
        p: 0.95
        std: 0.05

    - GridSample:
        grid_size: 0.02
        hash_type: "fnv"
        mode: "train"
        return_grid_coord: True

    - SphereCrop:
        sample_rate: 0.6
        mode: random
    
    - SphereCrop:
        point_max: 204800
        mode: random

    - CenterShift:
        apply_z: False
        center_mode: bounding_box

    - NormalizeColor: null

    - ToTensor: null

    - Collect:
        keys: ["coord", "grid_coord", "segment"]
        feat_keys: ["color", "normal"]


# =============================================================================
# Validation settings
# =============================================================================

val:
 split: "Area_5"
 batch_size: 12
 num_workers: 24
 transform:
  - Copy:
      keys_dict: {"coord": "origin_coord", "segment": "origin_segment"}
  - Update:
      keys_dict:
        index_valid_keys: [
              coord,
              color,
              normal,
              segment,
              grid_coord,
          ]

  - CenterShift:
      apply_z: true
      center_mode: bounding_box

  - GridSample:
      grid_size: 0.02
      hash_type: "fnv"
      mode: "train"
      return_grid_coord: True
      return_inverse: True

  - CenterShift:
        apply_z: False
        center_mode: bounding_box

  - NormalizeColor: null

  - ToTensor: null

  - Collect:
      keys: ["coord", "grid_coord", "segment", "origin_segment", "inverse"]
      # origin_offset gives per-scene original-point boundaries so validate() can
      # expand voxel preds → full resolution for a multi-scene (bs>1) batch.
      offset_keys_dict: {offset: "coord", origin_offset: "origin_segment"}
      feat_keys: ["color", "normal"]


# =============================================================================
# Test settings
# =============================================================================
test:
  split: "Area_5"
  checkpoint: ./outputs/s3dis/${run_name}/weights/.pt
  results_dir: ./outputs/s3dis/${run_name}/test_results
  batch_size: 1
  num_workers: 4

  transform:
    - Update:
        keys_dict:
          index_valid_keys: [coord, color, normal, segment]
    - CenterShift:
        apply_z: True
        center_mode: bounding_box
    - NormalizeColor: null

  test_cfg:
    voxelize:
      grid_size: 0.02
      hash_type: fnv
      mode: test
      return_grid_coord: True

    crop: null

    post_transform:
      - CenterShift:
          apply_z: False
          center_mode: bounding_box
      - ToTensor: null
      - Collect:
          keys: ["coord", "grid_coord", "index"]
          feat_keys: ["color", "normal"]

    aug_transform: 
      - RandomScale: {scale_range: [0.9, 0.9]}
      - RandomScale: {scale_range: [0.95, 0.95]}
      - RandomScale: {scale_range: [1, 1]}
      - RandomScale: {scale_range: [1.05, 1.05]}
      - RandomScale: {scale_range: [1.1, 1.1]}
      - {RandomScale: {scale_range: [0.9, 0.9]}, RandomFlip: {p: 1.0}}
      - {RandomScale: {scale_range: [0.95, 0.95]}, RandomFlip: {p: 1.0}}
      - {RandomScale: {scale_range: [1, 1]}, RandomFlip: {p: 1.0}}
      - {RandomScale: {scale_range: [1.05, 1.05]}, RandomFlip: {p: 1.0}}
      - {RandomScale: {scale_range: [1.1, 1.1]}, RandomFlip: {p: 1.0}}
        
# =============================================================================
# Optimizer and scheduler settings
# =============================================================================

optim:
  optimizer: adamw
  weight_decay: 0.05

param_dicts:
  # - keyword: image_fusion
  #   lr: 2e-4
  #   weight_decay: 0.01
  # - keyword: missing_proj
  #   lr: 2e-4
  #   weight_decay: 0.01
  # - keyword: fusion
  #   lr: 5e-4
  #   weight_decay: 0.005
  - keyword: block
    lr: 6e-4

  # For pretrained encoder
  # - keyword: block
  #   lr: 2e-5
  # - keyword: enc
  #   lr: 2e-5
  # - keyword: embedding
  #   lr: 2e-5


# scheduler:
#   start_lr: 6e-4
#   peak_lr: 6e-3
#   end_lr: 6e-7
#   warmup_epoch: 150


scheduler:
  type: OneCycleLR
  max_lr: 6e-3
  anneal_strategy: cos
  pct_start: 0.05
  div_factor: 10.0
  final_div_factor: 1000.0

# =============================================================================
# Losses settings
# =============================================================================

losses:
  - type: CrossEntropyLoss
    loss_weight: 1.0
    # label_smoothing: 0.01
    ignore_index: ${data.ignore_index}
  - type: LovaszLoss
    loss_weight: 1.0
    mode: multiclass
    ignore_index: ${data.ignore_index}