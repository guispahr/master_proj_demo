# H = fork of G that swaps the DINOv3 ViT backbone for the DINOv3 ConvNeXt
# backbone, which is natively hierarchical (4 stages at strides [4, 8, 16, 32]).
# No synthetic spatial pyramid: each decoder stage maps to one native backbone
# stage. Image fusion is configurable via image_fusion_type (fpn | per_stage).
# Everything else (gather fusion, geo decoder, multicam-attention support) is
# inherited unchanged from G.

_base_: base.yaml

run_name: LitePT-Ditr-v2-H/convnext-large-run3

dataset:
  type: NuScenesDataset
  with_images: True

mix_prob: 0.8

# =============================================================================
# Model settings
# =============================================================================
model:
  type: Point-Segmentor-GeoAux
  num_classes: 16
  backbone_out_channels: 72
  geo_out_channels: 72
  backbone:
    type: LitePT-Ditr-v2-H
    in_channels: 4
    order: ["z", "z-trans", "hilbert", "hilbert-trans"]
    stride: [2, 2, 2, 2]
    enc_depths: [2, 2, 2, 6, 2]
    enc_channels: [48, 96, 192, 384, 504]
    enc_num_head: [2, 4, 8, 16, 28]
    enc_patch_size: [1024, 1024, 1024, 1024, 1024]
    enc_conv: [True, True, True, False, False]
    enc_attn: [False, False, False, True, True]
    enc_rope_freq: [100.0, 100.0, 100.0, 100.0, 100.0]
    dec_depths: [0, 0, 0, 0]
    dec_channels: [72, 72, 144, 252]
    dec_num_head: [4, 4, 8, 14]
    dec_patch_size: [1024, 1024, 1024, 1024]
    dec_conv: [False, False, False, False]
    dec_attn: [False, False, False, False]
    dec_rope_freq: [100.0, 100.0, 100.0, 100.0]
    mlp_ratio: 4
    qkv_bias: True
    qk_scale: null
    attn_drop: 0.0
    proj_drop: 0.0
    drop_path: 0.3
    pre_norm: True
    shuffle_orders: True
    enc_mode: False
    freeze_encoder: False
    # DINOv3 ConvNeXt backbone — natively hierarchical (4 stages at strides
    # [4, 8, 16, 32]); no synthetic spatial pyramid. Variants: tiny | small |
    # base | large. Memory note: the stride-4 finest map is ~16× larger than
    # G's patch-16 ViT map — if it OOMs, drop dino_size, lower c_inner, or set
    # pre_gather: True.
    dino_size: large
    dino_frozen: True
    backbone_out_indices: [0, 1, 2, 3]   # one native backbone stage per decoder stage
    use_checkpoint: False

    # Image fusion over the native multi-scale stages:
    #   fpn        → project each stage to c_inner, then FPN top-down (default).
    #   fpn_concat → as fpn but merges skip & top_down via concat + 1×1
    #                (cross-source channel mixing, G-concat in spirit).
    #   per_stage  → project each stage independently (no cross-stage mixing).
    # image_fusion_type: fpn
    image_fusion_type: fpn_concat
    # image_fusion_type: fpn_concat   # uncomment to use the G-style concat merge
    # Fused image-feature width seen by gather / multicam attention / cls bias.
    c_inner: 256

    # Geometry-first image-modality dropout (uncomment if it overfits early on
    # images). Strong dropout early → annealed to a NON-ZERO floor. 4-tuple =
    # [start_epoch, end_epoch, p_start, p_end]. p_img drops ALL cameras of a
    # sample (LiDAR-only that step); p_cam drops individual (point,camera) views.
    # p_img_drop_schedule: [0, 15, 0.6, 0.2]
    # p_cam_drop_schedule: [0, 15, 0.3, 0.1]

    # Every decoder stage uses gather-based fusion (matches G's default).
    dec_fusion:
      - name: add_skip_up_image     # s=0  finest  (dec_channels[0] = 72)
        use_ffn: False
      - name: add_skip_up_image     # s=1           (dec_channels[1] = 72)
        use_ffn: False
      - name: add_skip_up_image     # s=2           (dec_channels[2] = 144)
        use_ffn: False
      - name: add_skip_up_image     # s=3  coarsest (dec_channels[3] = 252)
        use_ffn: False

    img_proj_dropout: 0.0

    geo_dec: true


# =============================================================================
# Training settings
# =============================================================================
training:
  split: train
  resume: null
  epochs: 50
  device: "cuda"
  eval_every: 1
  batch_size: 12
  seed: 42
  num_workers: 21
  prefetch_factor: 2
  amp: True
  amp_dtype: bfloat16
  grad_clip: 10.0
  debug_nan: True
  grad_accum: 1
  save_period: 10
  early_stopping_patience: 0
  transform:
    - Update:
        keys_dict:
          index_valid_keys: [
              coord,
              strength,
              segment,
              grid_coord,
              image_coord,
              image_mask
          ]

    - RandomZRotation:
        angle_range: [-1, 1]

    - RandomScale:
        scale_range: [0.9, 1.1]

    - RandomJitter:
        sigma: 0.005
        clip: 0.02

    - RandomFlip:
        p: 0.5

    - GridSample:
        grid_size: 0.05
        hash_type: "fnv"
        mode: "train"
        return_grid_coord: True

    - ImageResize:
        size: [576, 1024]

    - ImageColorJitter:
        brightness: 0.4
        contrast: 0.4
        saturation: 0.2
        hue: 0.1

    - ImageRandomHorizontalFlip: null

    - ImageNormalize: null

    - ToTensor: null

    - Collect:
        keys: ["coord", "grid_coord", "segment", "image", "image_coord", "image_mask"]
        feat_keys: ["coord", "strength"]


# =============================================================================
# Validation settings
# =============================================================================

val:
 split: val
 batch_size: 12
 num_workers: 24
 transform:
  - Update:
      keys_dict:
        index_valid_keys: [
              coord,
              strength,
              segment,
              grid_coord,
              image_coord,
              image_mask
          ]

  - GridSample:
      grid_size: 0.05
      hash_type: "fnv"
      mode: "train"
      return_grid_coord: True

  - ImageResize:
        size: [576, 1024]

  - ImageNormalize: null
  
  - ToTensor: null

  - Collect:
      keys: ["coord", "grid_coord", "segment", "image", "image_coord", "image_mask"]
      feat_keys: ["coord", "strength"]


# =============================================================================
# Test settings
# =============================================================================
test:
  split: val
  checkpoint: ./outputs/nuscenes/${run_name}/weights/best.pt
  results_dir: ./outputs/nuscenes/${run_name}/test_results
  batch_size: 1
  num_workers: 4

  transform:
    - Copy:
        keys_dict: {"segment": "origin_segment"}
    - Update:
        keys_dict:
          index_valid_keys: [coord, strength, segment, image_coord, image_mask]
    - GridSample:
        grid_size: 0.025
        hash_type: fnv
        mode: train
        return_inverse: True

    - ImageResize:
        size: [576, 1024]

    - ImageNormalize: null

  test_cfg:
    voxelize:
      grid_size: 0.05
      hash_type: fnv
      mode: test
      return_grid_coord: True

    crop: null

    post_transform:
      - ToTensor: null
      - Collect:
          # "image" is popped into `shared_image` in prepare_test_data and
          # reattached per-fragment by the tester — do NOT collect it here.
          keys: ["coord", "grid_coord", "index", "image_coord", "image_mask"]
          feat_keys: ["coord", "strength"]

    aug_transform: 
      - RandomScale: {scale_range: [0.9, 0.9]}
      - RandomScale: {scale_range: [0.95, 0.95]}
      - RandomScale: {scale_range: [1, 1]}
      - RandomScale: {scale_range: [1.05, 1.05]}
      - RandomScale: {scale_range: [1.1, 1.1]}
      - {RandomScale: {scale_range: [0.9, 0.9]}, RandomFlip: {p: 1.0}}
      - {RandomScale: {scale_range: [0.95, 0.95]}, RandomFlip: {p: 1.0}}
      - {RandomScale: {scale_range: [1, 1]}, RandomFlip: {p: 1.0}}
      - {RandomScale: {scale_range: [1.05, 1.05]}, RandomFlip: {p: 1.0}}
      - {RandomScale: {scale_range: [1.1, 1.1]}, RandomFlip: {p: 1.0}}
        
# =============================================================================
# Optimizer and scheduler settings
# =============================================================================

optim:
  optimizer: adamw
  weight_decay: 0.005

param_dicts:
  # - keyword: image_fusion
  #   lr: 2e-4
  #   weight_decay: 0.01
  # - keyword: missing_proj
  #   lr: 2e-4
  #   weight_decay: 0.01
  # - keyword: fusion
  #   lr: 5e-4
  #   weight_decay: 0.005
  - keyword: block
    lr: 2e-4

  # For pretrained encoder
  # - keyword: block
  #   lr: 2e-5
  # - keyword: enc
  #   lr: 2e-5
  # - keyword: embedding
  #   lr: 2e-5


# scheduler:
#   start_lr: 2e-4
#   peak_lr: 2e-3
#   end_lr: 2e-6
#   warmup_epoch: 2

scheduler:
  type: OneCycleLR
  max_lr: 2e-3
  anneal_strategy: cos
  pct_start: 0.04
  div_factor: 10.0
  final_div_factor: 100.0


losses:
  - type: CrossEntropyLoss
    loss_weight: 1.0
    # label_smoothing: 0.01
    ignore_index: ${data.ignore_index}
  - type: LovaszLoss
    loss_weight: 1.0
    mode: multiclass
    ignore_index: ${data.ignore_index}
  - type: AuxGeoLoss
    loss_weight: 0.5
    ignore_index: ${data.ignore_index}
    # label_smoothing: 0.01
    ce_weight: 1.0
    lovasz_weight: 1.0
    lovasz_mode: multiclass