_base_: base.yaml

run_name: PTV3/run2

dataset:
  type: NuScenesDataset
  with_images: False

mix_prob: 0.8
# =============================================================================
# Model settings
# =============================================================================
model:
  type: Base-Segmentor
  num_classes: 16
  backbone_out_channels: 64
  backbone:
    type: PT-v3-Base
    in_channels: 4
    order: ["z", "z-trans", "hilbert", "hilbert-trans"]
    stride: [2, 2, 2, 2]
    enc_depths: [2, 2, 2, 6, 2]
    enc_channels: [32, 64, 128, 256, 512]
    enc_num_head: [2, 4, 8, 16, 32]
    enc_patch_size: [1024, 1024, 1024, 1024, 1024]
    dec_depths: [2, 2, 2, 2]
    dec_channels: [64, 64, 128, 256]
    dec_num_head: [4, 4, 8, 16]
    dec_patch_size: [1024, 1024, 1024, 1024]
    mlp_ratio: 4
    qkv_bias: True
    qk_scale: null
    attn_drop: 0.0
    proj_drop: 0.0
    drop_path: 0.3
    pre_norm: True
    shuffle_orders: True
    enable_rpe: False
    enable_flash: True
    upcast_attention: False
    upcast_softmax: False
    pdnorm_bn: False
    pdnorm_ln: False
    pdnorm_decouple: False # For multi dataset
    pdnorm_adaptive: False # Compute shift and scale with SiLU + Linear layer
    pdnorm_affine: True
    pdnorm_conditions: null #["ScanNet", "S3DIS", "Structured3D"] # For multi dataset

training:
  split: train
  resume: null
  epochs: 50
  device: "cuda"
  eval_every: 1
  batch_size: 12
  seed: 42
  num_workers: 21
  prefetch_factor: 2
  amp: True
  amp_dtype: bfloat16
  grad_clip: 10.0
  debug_nan: True
  grad_accum: 1
  save_period: 10
  early_stopping_patience: 0
  transform:
    - Update:
        keys_dict:
          index_valid_keys: [
              coord,
              strength,
              segment,
              grid_coord,
          ]

    - RandomZRotation:
        angle_range: [-1, 1]

    - RandomScale:
        scale_range: [0.9, 1.1]

    - RandomJitter:
        sigma: 0.005
        clip: 0.02

    - RandomFlip:
        p: 0.5

    - GridSample:
        grid_size: 0.05
        hash_type: "fnv"
        mode: "train"
        return_grid_coord: True

    - ToTensor: null

    - Collect:
        keys: ["coord", "grid_coord", "segment"]
        feat_keys: ["coord", "strength"]


# =============================================================================
# Validation settings
# =============================================================================

val:
 split: val
 batch_size: 12
 num_workers: 24
 transform:
  - Update:
      keys_dict:
        index_valid_keys: [
              coord,
              strength,
              segment,
              grid_coord,
          ]

  - GridSample:
      grid_size: 0.05
      hash_type: "fnv"
      mode: "train"
      return_grid_coord: True

  - ToTensor: null

  - Collect:
      keys: ["coord", "grid_coord", "segment"]
      feat_keys: ["coord", "strength"]


# =============================================================================
# Test settings
# =============================================================================
test:
  split: val
  checkpoint: ./outputs/nuscenes/${run_name}/weights/.pt
  results_dir: ./outputs/nuscenes/${run_name}/test_results
  batch_size: 1
  num_workers: 4

  transform:
    - Copy:
        keys_dict: {"segment": "origin_segment"}
    - Update:
        keys_dict:
          index_valid_keys: [coord, strength, segment]
    - GridSample:
        grid_size: 0.025
        hash_type: fnv
        mode: train
        return_inverse: True

  test_cfg:
    voxelize:
      grid_size: 0.05
      hash_type: fnv
      mode: test
      return_grid_coord: True

    crop: null

    post_transform:
      - ToTensor: null
      - Collect:
          keys: ["coord", "grid_coord", "index"]
          feat_keys: ["coord", "strength"]

    aug_transform: 
      - RandomScale: {scale_range: [0.9, 0.9]}
      - RandomScale: {scale_range: [0.95, 0.95]}
      - RandomScale: {scale_range: [1, 1]}
      - RandomScale: {scale_range: [1.05, 1.05]}
      - RandomScale: {scale_range: [1.1, 1.1]}
      - {RandomScale: {scale_range: [0.9, 0.9]}, RandomFlip: {p: 1.0}}
      - {RandomScale: {scale_range: [0.95, 0.95]}, RandomFlip: {p: 1.0}}
      - {RandomScale: {scale_range: [1, 1]}, RandomFlip: {p: 1.0}}
      - {RandomScale: {scale_range: [1.05, 1.05]}, RandomFlip: {p: 1.0}}
      - {RandomScale: {scale_range: [1.1, 1.1]}, RandomFlip: {p: 1.0}}
        
# =============================================================================
# Optimizer and scheduler settings
# =============================================================================

optim:
  optimizer: adamw
  weight_decay: 0.005

param_dicts:
  # - keyword: image_fusion
  #   lr: 2e-4
  #   weight_decay: 0.01
  # - keyword: missing_proj
  #   lr: 2e-4
  #   weight_decay: 0.01
  # - keyword: fusion
  #   lr: 5e-4
  #   weight_decay: 0.005
  - keyword: block
    lr: 2e-4

  # For pretrained encoder
  # - keyword: block
  #   lr: 2e-5
  # - keyword: enc
  #   lr: 2e-5
  # - keyword: embedding
  #   lr: 2e-5


# scheduler:
#   start_lr: 2e-4
#   peak_lr: 2e-3
#   end_lr: 2e-6
#   warmup_epoch: 2

scheduler:
  type: OneCycleLR
  max_lr: 2e-3
  anneal_strategy: cos
  pct_start: 0.04
  div_factor: 10.0
  final_div_factor: 100.0



# =============================================================================
# Losses settings
# =============================================================================

losses:
  - type: CrossEntropyLoss
    loss_weight: 1.0
    ignore_index: ${data.ignore_index}
  - type: LovaszLoss
    loss_weight: 1.0
    mode: multiclass
    ignore_index: ${data.ignore_index}